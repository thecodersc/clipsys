[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipsys"
version = "0.1.0"
description = "GTA 6 source-video clip pipeline: score, cut, caption, publish"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12", "pydantic>=2.7", "pyyaml>=6.0", "faster-whisper>=1.0", "httpx>=0.27",
  "google-api-python-client>=2.130", "google-auth-oauthlib>=1.2", "google-auth-httplib2>=0.2",
  "requests>=2.31", "fastapi>=0.111", "uvicorn[standard]>=0.29", "jinja2>=3.1",
  "python-dotenv>=1.0", "pydantic-settings>=2.2", "qrcode>=7.4", "rich>=13.7",
  "twilio>=9.0", "resend>=2.0",
  "streamlink>=6",     # `clipsys record`: capture live streams
  "python-multipart",  # FastAPI form posts in the review UI
  "av<19",             # PyAV 19 dropped metadata_errors, which faster-whisper 1.2 still passes
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "pytest>=8.2", "pytest-asyncio>=0.23"]

[project.scripts]
clipsys = "clipsys.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clipsys = ["db/schema.sql"]
